app:
  version: "1.0.0"
  env: test
server:
  port: 8102
mysql:
  host: "127.0.0.1"
  port: 3306
  username: "root"
  password: ""
  dbname: "ai_test"

ai_tools:
  enabled: true
  allow_write: true
  allow_all_permissions: true
  audit_enabled: true

claude:
  api_key: ""
  model: "us.anthropic.claude-sonnet-4-6"
  base_url: "https://d3op0m6ej5uzjt.cloudfront.net/v1/chat/completions"

deepseek:
  # 推荐填环境变量名，避免把真实密钥写进仓库。
  # env_key: "DEEPSEEK_API_KEY"
  env_key: ""
  model: "deepseek-chat"
  # DeepSeek 文档支持 https://api.deepseek.com 和 https://api.deepseek.com/v1 两种 base_url 写法。
  base_url: "https://api.deepseek.com"

codex:
  # 推荐填环境变量名，避免把真实密钥写进仓库。
  # env_key: "AZURE_OPENAI_API_KEY"
  env_key: ""
  # model: "gpt-5.4"
  model: "gpt-5.4"
  base_url: "https://rn-software-devops-eastus2.openai.azure.com/openai"
  api_version: "2025-04-01-preview"
  auth_type: "api-key"
  wire_api: "responses"
  model_reasoning_effort: "medium"
  service_tier: "fast"


